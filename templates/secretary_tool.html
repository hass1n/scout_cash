<section id="editor" class="panel"><h2>إنشاء كتاب رسمي</h2><div class="grid">
<div><label>رقم الصادر</label><input id="serial" readonly></div><div><label>التاريخ</label><input id="date" type="date"></div>
<div class="full"><label>الجهة الموجّه إليها (جانب)</label><textarea id="recipient" style="min-height:65px" placeholder="جانب / رئيس بلدية الدورة المهندس ..."></textarea></div>
<div class="full"><label>الموضوع</label><input id="subject" placeholder="كتاب شكر وتقدير"></div>
<div class="full"><label>نص الكتاب</label><textarea id="body" placeholder="تحية كشفية وبعد..."></textarea></div>
<div class="full"><label>إرفاق ملفات (JPG / PNG / PDF)</label><input id="files" type="file" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf" multiple><div class="hint" id="fileNames">لم يتم اختيار ملفات.</div></div>
</div><div id="notice"></div><div class="actions"><button onclick="preview()">معاينة</button><button class="orange" onclick="saveLetter()">حفظ بالأرشيف</button><button class="light" onclick="clearForm()">تفريغ الحقول</button></div></section>
<section id="archive" class="panel hidden"><h2>أرشيف الكتب</h2><input id="search" placeholder="بحث بالرقم أو الجهة أو الموضوع" oninput="renderArchive()"><div id="archiveList" class="list" style="margin-top:12px"></div></section>
<section id="settings" class="panel hidden"><h2>بيانات التوقيع</h2><div class="grid">
<div><label>صفة الموقّع الأيسر</label><input id="roleLeft" value="قائد فوج الدورة"></div><div><label>صفة الموقّع الأيمن</label><input id="roleRight" value="أمين السر في فوج الدورة"></div>
<div><label>اسم الموقّع الأيسر</label><input id="nameLeft" value="أحمد أبو علي"></div><div><label>اسم الموقّع الأيمن</label><input id="nameRight" value="نور الهدى ظاهر"></div>
</div><div class="actions"><button class="orange" onclick="saveSettings()">حفظ</button></div></section>
<section id="previewPanel" class="panel hidden"><div class="actions no-print" style="margin:0 0 12px"><button class="orange" onclick="downloadImage()">تنزيل الكتاب صورة PNG</button><button onclick="window.print()">طباعة / حفظ PDF</button><button class="light" onclick="show('editor')">عودة</button></div>
<div id="sheet">
<div class="serial">رقم الصادر: <span id="pSerial"></span></div><div class="recipient" id="pRecipient"></div><div class="subject" id="pSubject"></div><div class="body" id="pBody"></div><div class="date" id="pDate"></div>
<div class="sigleft" id="pRoleLeft"></div><div class="sigright" id="pRoleRight"></div><img class="stamp" src="/static/images/secretary-stamp.png" alt="الختم والتواقيع"><div class="signames" id="pNameLeft"></div><div class="signames2" id="pNameRight"></div>
</div></section>
